name: Dependency audit evidence
on:
  pull_request:
    branches:
      - fix/bg00-npm-lock-reconcile-20261126
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect and validate npm audit evidence
        shell: bash
        run: |
          mkdir -p audit-evidence
          set +e
          npm audit --json --audit-level=high > audit-evidence/full.json
          full=$?
          npm audit --omit=dev --json --audit-level=high > audit-evidence/runtime.json
          runtime=$?
          set -e
          printf 'full_exit=%s\nruntime_exit=%s\n' "$full" "$runtime" > audit-evidence/status.txt
          git rev-parse HEAD > audit-evidence/sha.txt
          node --version >> audit-evidence/status.txt
          npm --version >> audit-evidence/status.txt
          node --input-type=module -e '
            import fs from "node:fs";
            for (const name of ["full", "runtime"]) {
              const report = JSON.parse(fs.readFileSync("audit-evidence/" + name + ".json", "utf8"));
              if (report.error || !report.metadata?.vulnerabilities || !report.vulnerabilities) throw new Error("Invalid audit response: " + name);
              console.log(name, JSON.stringify(report.metadata.vulnerabilities));
              for (const [pkg, detail] of Object.entries(report.vulnerabilities)) {
                if (["critical", "high"].includes(detail.severity)) console.log(pkg, detail.severity, JSON.stringify(detail.fixAvailable));
              }
            }'
          test "$full" -eq 0 && test "$runtime" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-evidence
          path: audit-evidence/
          if-no-files-found: error
          retention-days: 7
  remediation-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate compatible candidate and capture evidence
        shell: bash
        run: |
          mkdir -p remediation-evidence
          set +e
          npm audit fix --package-lock-only --ignore-scripts --json > remediation-evidence/fix.json
          fix=$?
          set -e
          printf 'fix_exit=%s\n' "$fix" > remediation-evidence/status.txt
          git diff -- package.json package-lock.json > remediation-evidence/npm.patch
          cp package-lock.json remediation-evidence/package-lock.json
          cp package.json remediation-evidence/package.json
          git rev-parse HEAD > remediation-evidence/base-sha.txt
          git diff --exit-code -- package.json
          npm ci --ignore-scripts
          npm rebuild
          npm test
          npm run build
      - name: Reaudit candidate
        if: always()
        shell: bash
        run: |
          npm audit --json --audit-level=high > remediation-evidence/post-full.json
        continue-on-error: false
      - name: Reaudit runtime
        if: always()
        shell: bash
        run: |
          npm audit --omit=dev --json --audit-level=high > remediation-evidence/post-runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatible-remediation-candidate
          path: remediation-evidence/
          if-no-files-found: error
          retention-days: 7
  major-remediation-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate explicit major upgrade candidate
        shell: bash
        run: |
          mkdir -p major-evidence
          git rev-parse HEAD > major-evidence/base-sha.txt
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact vite@7.3.8 vitest@5.1.2 @vitejs/plugin-react-swc@4.3.3 > major-evidence/install.log 2>&1
          npm install --package-lock-only --ignore-scripts --save-exact zod@4.6.7 >> major-evidence/install.log 2>&1
          set +e
          npm audit fix --package-lock-only --ignore-scripts --json > major-evidence/fix.json
          set -e
          git diff -- package.json package-lock.json > major-evidence/npm.patch
          cp package.json package-lock.json major-evidence/
          npm ci
          npm test
          npm run build
      - name: Type checking
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.app.json
      - name: Reaudit full and runtime
        if: always()
        shell: bash
        run: |
          set +e
          npm audit --json --audit-level=high > major-evidence/full.json
          full=$?
          npm audit --omit=dev --json --audit-level=high > major-evidence/runtime.json
          runtime=$?
          set -e
          printf 'full=%s\nruntime=%s\n' "$full" "$runtime" > major-evidence/status.txt
          node -e 'for(const name of ["full","runtime"]){const r=require("./major-evidence/"+name+".json");if(!r.metadata?.vulnerabilities||r.error)process.exit(1);console.log(name,r.metadata.vulnerabilities);for(const [k,v] of Object.entries(r.vulnerabilities))if(["critical","high"].includes(v.severity))console.log(k,v.severity,v.fixAvailable)}'
          test "$full" -eq 0 && test "$runtime" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: major-remediation-candidate
          path: major-evidence/
          if-no-files-found: error
          retention-days: 7
